name: ai-brain CI

on:
  push:
    branches: [main, master, "codex/**", "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ai-brain-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck / build / test / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm audit --audit-level=high

      # Real @huggingface/transformers model (~90MB, network-dependent) --
      # deliberately excluded from `npm test`'s default file list (see
      # packages/storage/package.json) so the required gate above stays fast
      # and hermetic. Runs here for visibility only; never blocks the pipeline.
      - name: storage embedding-model integration test (non-blocking)
        continue-on-error: true
        run: |
          npm run test:integration --workspace=@brain/storage
