name: ai-brain CI

on:
  push:
    branches: [main, master]
    paths:
      - "ai-brain/**"
      - ".github/workflows/ai-brain-ci.yml"
  pull_request:
    paths:
      - "ai-brain/**"
      - ".github/workflows/ai-brain-ci.yml"

concurrency:
  group: ai-brain-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ai-brain

jobs:
  ci:
    name: typecheck / build / test / audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ai-brain/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test

      - run: npm audit --audit-level=high

      # Real @huggingface/transformers model (~90MB, network-dependent) --
      # deliberately excluded from `npm test`'s default file list (see
      # packages/storage/package.json) so the required gate above stays fast
      # and hermetic. Runs here for visibility only; never blocks the pipeline.
      - name: storage embedding-model integration test (non-blocking)
        continue-on-error: true
        run: |
          npm run pretest:integration --workspace=@brain/storage
          npm run test:integration --workspace=@brain/storage
